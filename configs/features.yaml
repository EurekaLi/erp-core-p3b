erp:
  # 主要分析固定为 Pz 的 300--600 ms 平均幅值，避免依据显著性后验挑选窗口。
  p3b_window_s: [0.3, 0.6]
  channels: [Pz]
  # 该 ROI 只用于次要的空间稳健性分析；数据中没有 POz 通道。
  posterior_roi_channels: [CPz, Pz, PO3, PO4]
  measurements:
    - mean_amplitude
    - peak_amplitude
    - peak_latency
    - area_under_curve

time_frequency:
  method: morlet
  parameters_frozen: true
  decision_record: docs/09_tfr_epoch_audit.md
  audit_config: configs/tfr_audit.yaml
  audit_summary: results/tfr_audit/audit_summary.json
  # 6 Hz 下限保护固定基线的完整核支持；2--5 Hz 不进入基线归一化主分析。
  fmin_hz: 6.0
  fmax_hz: 30.0
  frequency_step_hz: 1.0
  target_sfreq_hz: 256.0
  # 保留额外的真实信号供低频探索；正式展示不是整个长epoch。
  epoch_window_s: [-2.1, 2.1]
  voltage_baseline_s: null
  display_window_s: [-0.2, 0.8]
  measurement_window_s: [0.3, 0.6]
  baseline_s: [-0.6, -0.4]
  baseline_mode: db
  # db 定义为 10*log10(power / baseline_mean)，不能直接等同于MNE的logratio。
  morlet:
    cycle_divisor_hz: 2.0
    min_cycles: 3.0
    max_cycles: 10.0
    zero_mean: true
  batch_trials: 8
  n_jobs: 1
  planning_budget_gib: 2.0
  band_boundary_rule: left_closed_right_open_except_last
  bands:
    theta_high: [6.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
  exploratory_low_frequency:
    fmin_hz: 2.0
    fmax_hz: 5.0
    baseline_s: null
    baseline_mode: none
    include_in_primary_ml_features: false
    # 小波完整不等于事件特异；该分支不支持精准起始时刻或纯当前刺激的解释。
    role: exploratory_unbaselined_power_only

wavelet:
  family: db4
  level: null
  measurements:
    - relative_energy
    - wavelet_entropy
    - coefficient_mean
    - coefficient_std

pca:
  enabled: true
  variance_retained: 0.95
  # PCA 必须处于交叉验证 Pipeline 内，不能在完整数据集上预先拟合。
  fit_scope: training_fold_only

