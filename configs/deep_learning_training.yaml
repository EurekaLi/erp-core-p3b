models: [eegnet, cbramod_linear, cbramod_finetune]
eegnet:
  F1: 8
  D: 2
  F2: 16
  temporal_kernel: 128
  separable_kernel: 16
  pool_sizes: [4, 8]
  dropout: 0.5
  spatial_max_norm: 1.0
  classifier_max_norm: 0.25
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
cbramod:
  batch_size: 16
  head_learning_rate: 0.001
  encoder_learning_rate: 0.00001
  weight_decay: 0.01
training:
  seed: 2026
  max_epochs: 80
  smoke_epochs: 5
  patience: 12
  smoke_patience: 3
  improvement_tolerance: 0.000001
  gradient_clip_norm: 1.0
  # 严格确定性遇到不支持的CUDA算子会停止，不静默降低要求。
  deterministic: true
  cpu_threads: 4
  prediction_threshold: 0.5
statistics:
  confidence_level: 0.95
  bootstrap_iterations: 2000
  random_state: 42
lr_reference_directory: results/traditional_lr/lr-full
outputs:
  directory: results/deep_learning
