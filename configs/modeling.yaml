# 基础闭环只做LR；LDA/SVM、PCA和置换检验另作扩展，不阻塞深度学习。
experiments:
  erp: [erp]
  erp_power: [erp, power]
  erp_power_wavelet: [erp, power, wavelet]
model:
  C: 1.0
  class_weight: balanced
  solver: lbfgs
  max_iter: 2000
  random_state: 42
  prediction_threshold: 0.5
statistics:
  confidence_level: 0.95
  bootstrap_iterations: 2000
  random_state: 42
outputs:
  directory: results/traditional_lr

