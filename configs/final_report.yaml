inputs:
  classification_directory: data/processed/classification/v1
  dl_directory: results/deep_learning/three-models-full-v1
  lr_directory: results/traditional_lr/lr-full
  erp_statistics: results/erp_analysis/group_statistics.csv
models:
  lr_erp: {source: lr, experiment: erp, label: LR ERP (12)}
  lr_erp_power: {source: lr, experiment: erp_power, label: LR ERP+PSD (24)}
  lr_all: {source: lr, experiment: erp_power_wavelet, label: LR ERP+PSD+DWT (40)}
  eegnet: {source: dl, experiment: eegnet, label: EEGNet}
  cbramod_linear: {source: dl, experiment: cbramod_linear, label: CBraMod linear}
  cbramod_finetune: {source: dl, experiment: cbramod_finetune, label: CBraMod finetune}
# 参考模型不按测试最高分选择；差值统一为candidate-reference。
contrasts:
  - [lr_erp, eegnet]
  - [lr_erp, cbramod_linear]
  - [lr_erp, cbramod_finetune]
  - [cbramod_linear, cbramod_finetune]
  - [eegnet, cbramod_finetune]
  - [lr_erp, lr_erp_power]
  - [lr_erp_power, lr_all]
statistics:
  confidence_level: 0.95
  bootstrap_iterations: 2000
  random_state: 42
prediction_threshold: 0.5
outputs:
  directory: results/final_report/v1
